[project]
name = "luca-assistente-financeiro"
version = "1.3.0"
description = "Assistente financeiro pessoal local, com múltiplas contas, cartões, planejamento e controle de valores entre pessoas."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["personal-finance", "finance", "fastapi", "sqlite", "portuguese"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
